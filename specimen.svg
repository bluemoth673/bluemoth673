    <text x="60" y="276" class="term" xml:space="preserve" style="animation: appear 0.15s 4.26s both"><tspan fill="#ff6b6b">[ALERT] </tspan><tspan fill="#e6edf3">port scan from 10.0.0.7</tspan></text>
    <text x="60" y="300" class="term" xml:space="preserve" style="animation: appear 0.15s 4.66s both"><tspan fill="#9da7b3">        T1046 · severity </tspan><tspan fill="#ffb454">HIGH</tspan></text>
    <text x="60" y="348" class="term" xml:space="preserve" style="animation: reveal 0.32s steps(8, end) 5.0600000000000005s both"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
    <text x="60" y="372" class="term" xml:space="preserve" style="animation: appear 0.15s 5.880000000000001s both"><tspan fill="#79c0ff">attacker. defender. both.</tspan></text>
    <rect x="263" y="360" width="8" height="15" fill="#79c0ff" class="caret" style="animation: blink 1s steps(1) 6.28s infinite, appear 0.01s 6.28s both"/>
  </g>

  <!-- divider -->
  <line x1="460" y1="80" x2="460" y2="420" stroke="#232a3a" stroke-dasharray="2 5"/>

  <!-- catalogue entry -->
