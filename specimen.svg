<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Specimen No. 673: Blue Moth, Abdulrahman tamerensis">
  <title>Specimen Nº 673 — Blue Moth (Abdulrahman tamerensis)</title>
  <defs>
    <radialGradient id="bg" cx="30%" cy="35%" r="85%">
      <stop offset="0" stop-color="#161b26"/>
      <stop offset="0.6" stop-color="#0c0f16"/>
      <stop offset="1" stop-color="#06070a"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe3a6" stop-opacity="0.95"/>
      <stop offset="0.12" stop-color="#ffc56b" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff9e3d" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ff9e3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fore" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#1b2950"/>
      <stop offset="0.55" stop-color="#2f4d94"/>
      <stop offset="1" stop-color="#7fa6f0"/>
    </linearGradient>
    <linearGradient id="hind" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182344"/>
      <stop offset="1" stop-color="#3a5aa8"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0a0d18"/>
      <stop offset="0.35" stop-color="#0a0d18"/>
      <stop offset="0.4" stop-color="#cfe0ff"/>
      <stop offset="0.7" stop-color="#6f93e6"/>
      <stop offset="1" stop-color="#2a3f7a"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- one right-hand wing pair, mirrored for the left -->
    <g id="wing">
      <path d="M4,-12 C26,-46 92,-70 138,-52 C141,-44 136,-36 128,-31 C100,-12 56,-2 6,2 Z" fill="url(#fore)" stroke="#9dbdff" stroke-opacity="0.55" stroke-width="1"/>
      <path d="M8,-6 C40,-30 80,-44 124,-46 M10,-2 C46,-16 84,-26 120,-34 M12,0 C50,-6 86,-12 112,-24" fill="none" stroke="#a9c4ff" stroke-opacity="0.22" stroke-width="0.8"/>
      <path d="M100,-50 l8,-3 l2,6 l-8,3 Z M118,-49 l7,-2 l1,5 l-7,2 Z" fill="#cfe0ff" fill-opacity="0.35"/>
      <path d="M5,3 C46,4 92,18 92,52 C84,70 46,66 24,48 C14,38 8,24 4,14 Z" fill="url(#hind)" stroke="#9dbdff" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="56" cy="34" r="13" fill="url(#eye)"/>
      <circle cx="53" cy="30" r="2.2" fill="#ffffff" fill-opacity="0.75"/>
      <path d="M30,52 C46,62 70,64 86,56" fill="none" stroke="#cfe0ff" stroke-opacity="0.25" stroke-width="1"/>
    </g>
  </defs>

  <style>
    .label  { font-family: "Courier New", Courier, "Liberation Mono", monospace; fill: #8a93a8; font-size: 13px; letter-spacing: 0.5px; }
    .value  { font-family: "Courier New", Courier, "Liberation Mono", monospace; fill: #dfe6f5; font-size: 15px; }
    .serif  { font-family: Georgia, "Times New Roman", "DejaVu Serif", serif; }
    .tiny   { font-family: "Courier New", Courier, monospace; fill: #5b6378; font-size: 11px; letter-spacing: 2px; }
    .flicker { animation: flicker 7s infinite; }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      41% { opacity: 1; } 42% { opacity: 0.55; } 43% { opacity: 1; }
      44% { opacity: 0.7; } 46% { opacity: 1; }
      78% { opacity: 0.92; } 80% { opacity: 1; }
    }
    .type { animation: reveal 1.2s steps(30, end) both; }
    @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    .d1 { animation-delay: 0.3s; } .d2 { animation-delay: 0.7s; } .d3 { animation-delay: 1.1s; }
    .d4 { animation-delay: 1.5s; } .d5 { animation-delay: 1.9s; } .d6 { animation-delay: 2.3s; }
    .d7 { animation-delay: 2.7s; }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- ground -->
  <rect width="900" height="480" fill="url(#bg)"/>

  <!-- the light the moth keeps circling -->
  <g class="flicker">
    <circle cx="96" cy="70" r="200" fill="url(#lamp)"/>
    <circle cx="96" cy="70" r="5" fill="#fff3d6" filter="url(#glow)"/>
  </g>

  <!-- dust drifting toward the light -->
  <g fill="#ffe3a6">
    <circle r="1.2" opacity="0"><animate attributeName="cx" values="300;130" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="330;90" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle r="0.9" opacity="0"><animate attributeName="cx" values="380;150" dur="12s" begin="3s" repeatCount="indefinite"/><animate attributeName="cy" values="260;80" dur="12s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="12s" begin="3s" repeatCount="indefinite"/></circle>
    <circle r="1" opacity="0"><animate attributeName="cx" values="220;110" dur="7s" begin="5s" repeatCount="indefinite"/><animate attributeName="cy" values="400;100" dur="7s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="7s" begin="5s" repeatCount="indefinite"/></circle>
    <circle r="0.8" opacity="0"><animate attributeName="cx" values="60;90" dur="10s" begin="1s" repeatCount="indefinite"/><animate attributeName="cy" values="380;95" dur="10s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- card frame -->
  <rect x="18" y="18" width="864" height="444" fill="none" stroke="#2a3142" stroke-width="1"/>
  <rect x="24" y="24" width="852" height="432" fill="none" stroke="#1b2130" stroke-width="1"/>
  <text x="856" y="50" class="tiny" text-anchor="end">SPECIMEN Nº 673 · ░ CATALOGUED</text>

  <!-- the specimen -->
  <g transform="translate(230 262)">
    <!-- shadow on the board -->
    <ellipse cx="6" cy="96" rx="120" ry="10" fill="#000" opacity="0.3" filter="url(#soft)"/>
    <!-- wings: pinned, but they still twitch now and then -->
    <g>
      <g>
        <use href="#wing" xlink:href="#wing"/>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;0.82 1;1 1;0.9 1;1 1" keyTimes="0;0.86;0.89;0.92;0.95;1" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="scale(-1 1)">
      <g>
        <use href="#wing" xlink:href="#wing"/>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;0.82 1;1 1;0.9 1;1 1" keyTimes="0;0.86;0.89;0.92;0.95;1" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>
    <!-- antennae (feathered) -->
    <g fill="none" stroke="#b7c9ee" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
      <path d="M-2,-30 C-10,-52 -26,-66 -42,-72"/>
      <path d="M2,-30 C10,-52 26,-66 42,-72"/>
      <path d="M-8,-44 l-6,-2 M-14,-53 l-6,-1 M-21,-60 l-6,0 M-29,-66 l-5,1 M-8,-44 l-2,-6 M-14,-53 l-2,-6 M-21,-60 l-1,-6 M-29,-66 l0,-5" stroke-width="0.7" opacity="0.7"/>
      <path d="M8,-44 l6,-2 M14,-53 l6,-1 M21,-60 l6,0 M29,-66 l5,1 M8,-44 l2,-6 M14,-53 l2,-6 M21,-60 l1,-6 M29,-66 l0,-5" stroke-width="0.7" opacity="0.7"/>
    </g>
    <!-- body -->
    <ellipse cx="0" cy="-24" rx="6.5" ry="7" fill="#26355e" stroke="#9dbdff" stroke-opacity="0.5"/>
    <ellipse cx="0" cy="8" rx="7" ry="30" fill="#1d2a4d" stroke="#9dbdff" stroke-opacity="0.45"/>
    <path d="M-6,0 h12 M-6.5,8 h13 M-6,16 h12 M-5,24 h10 M-4,31 h8" stroke="#9dbdff" stroke-opacity="0.25"/>
    <circle cx="-3" cy="-26" r="1.4" fill="#ffd58a"/>
    <circle cx="3" cy="-26" r="1.4" fill="#ffd58a"/>
    <!-- the pin -->
    <line x1="0" y1="-118" x2="0" y2="-12" stroke="#c9ccd6" stroke-width="1.2"/>
    <circle cx="0" cy="-121" r="5" fill="#a3262a" stroke="#4a0d10"/>
    <circle cx="-1.5" cy="-122.5" r="1.4" fill="#ffb3b3" opacity="0.8"/>
  </g>
  <text x="230" y="425" class="tiny" text-anchor="middle">fig. 1 · pinned, mostly</text>

  <!-- divider -->
  <line x1="460" y1="80" x2="460" y2="420" stroke="#232a3a" stroke-dasharray="2 5"/>

  <!-- catalogue entry -->
  <g transform="translate(492 0)">
    <text x="0" y="104" class="serif" fill="#eef2fb" font-size="38" font-weight="400">Blue Moth</text>
    <text x="0" y="134" class="serif" fill="#9fb4e0" font-size="19" font-style="italic">Abdulrahman tamerensis</text>
    <text x="0" y="158" class="tiny">ORDER LEPIDOPTERA · FAMILY SECURITAS</text>

    <g class="type d1"><text x="0" y="202" class="label">HABITAT</text><text x="128" y="202" class="value">terminals, after 2 a.m.</text></g>
    <g class="type d2"><text x="0" y="232" class="label">ATTRACTED TO</text><text x="128" y="232" class="value">logs · packets · anomalies</text></g>
    <g class="type d3"><text x="0" y="262" class="label">BEHAVIOUR</text><text x="128" y="262" class="value">circles every light</text></g>
    <g class="type d4"><text x="128" y="282" class="value">until it understands it</text></g>
    <g class="type d5"><text x="0" y="312" class="label">COLLECTED</text><text x="128" y="312" class="value">AAST · cybersecurity</text></g>
    <g class="type d6"><text x="0" y="342" class="label">FIRST SEEN</text><text x="128" y="342" class="value">29 · VI · 2025</text></g>
    <g class="type d7"><text x="0" y="372" class="label">STATUS</text><text x="128" y="372" class="value" fill="#ffd58a">active</text><text x="190" y="372" class="value">— leading ARES</text><rect x="334" y="360" width="8" height="15" fill="#ffd58a" class="caret"/></g>

    <text x="364" y="420" class="tiny" text-anchor="end">bluemoth673</text>
  </g>
</svg>
