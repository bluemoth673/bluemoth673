    <g class="type d3"><text x="96" y="262" class="value">SQLi · XSS · vuln assessment</text></g>
    <g class="type d4"><text x="0" y="292" class="label">DEFENSE</text><text x="96" y="292" class="value">Wazuh · M365 security · OpManager</text></g>
