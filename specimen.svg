    <path d="M40,82 a10,10 0 0 1 10,-10 h376 a10,10 0 0 1 10,10 v18 h-396 Z" fill="#161b22"/>
    <line x1="40" y1="100" x2="436" y2="100" stroke="#30363d"/>
    <circle cx="60" cy="86" r="5" fill="#ff5f57"/><circle cx="78" cy="86" r="5" fill="#febc2e"/><circle cx="96" cy="86" r="5" fill="#28c840"/>
    <text x="238" y="90" class="tiny" text-anchor="middle">moth@arch: ~</text>
    <text x="60" y="132" class="term" xml:space="preserve" style="animation: reveal 0.88s steps(22, end) 0.3s both"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">nmap -sV 10.0.0.0/24</tspan></text>
    <text x="60" y="156" class="term" xml:space="preserve" style="animation: appear 0.15s 1.68s both"><tspan fill="#6e7681">PORT    STATE  SERVICE</tspan></text>
    <text x="60" y="180" class="term" xml:space="preserve" style="animation: appear 0.15s 2.08s both"><tspan fill="#9da7b3">22/tcp  open   ssh</tspan></text>
