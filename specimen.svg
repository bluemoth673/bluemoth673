    <g class="type d5"><text x="0" y="342" class="label">CODE</text><text x="96" y="342" class="value">Python · Java · C/C++ · Bash · JS</text></g>
    <g class="type d6"><text x="0" y="372" class="label">SYSTEMS</text><text x="96" y="372" class="value">Linux · Docker · React · Git</text></g>
